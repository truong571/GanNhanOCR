  # 27/09: Borg chép tay = tập đánh giá có nhãn người (đo: scripts/measure/borg_endtoend_eval.py). Bộ kiểm chữ viết tay LOBO-SÁCH:
  # B18 (SachKinhThayCaBinh) chấm bằng mô hình/nguyên mẫu/hiệu chuẩn học trên DungLy, B34 (SachDungLyHoThan) bằng bản học trên Kinh
