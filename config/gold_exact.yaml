# config/gold_exact.yaml — ngưỡng / cờ của pipeline.gold_exact (cấu hình "lai" TN4 + luật A/M-OCR chính sách v3;
# core_loss chỉ còn là cột thông tin — gate: false, xem khối core_loss).
# QUY TẮC: mọi số dưới đây lấy NGUYÊN từ phép đo đã có (ghi nguồn); KHÔNG dò lại trên dữ liệu đo. Tham số crop chuẩn v2 đóng băng
# trong pipeline/gold_exact/crop_chuan.py (PARAMS = cclib_v2.PARAMS, md5 d818443449); đổi = phải đo lại TN4.
# <SP> = thư mục thử nghiệm phiên 25–27/09/2026 (scratchpad); bản lưu một phần ở measure_out/_audit_2026-09-25/, _audit_2026-09-26/.
# version = policy_version ghi vào mỗi dòng gold_exact.csv. "2026-09-27" = lượt run1 (core_loss là cổng);
# "2026-09-27.2" = bỏ core_loss khỏi cổng (quyết định 27/09, xem core_loss.gate).
# "2026-09-28" = sửa rò rỉ N6: TA của TK không còn nhìn GT người IHR (mọi ô TK căn được với Kiều 1871 LVD đều được chấm TA).
# "2026-09-28.2" = thêm profile handwriting (khối `profiles` bên dưới; 6 bộ in/khắc giữ nguyên quyết định từng ô).
version: "2026-09-28.2"

# PROFILE theo loại chữ (28/09, TN5 — lab/thu_nghiem_anh_chu/TN5_viet_tay, docs/GOLD_CHINH_XAC_2026-09-27.md §11).
# handwriting: bộ CHỮ VIẾT TAY (STT chép tay + 2 bản chép tay Borg có nhãn người). Hiệu chuẩn trên nhãn người Borg (CHỈ để đo):
#   - drop_gates [cnt]: CNT (số chữ OCR cột ≠ số âm QN) KHÔNG hạ ô viết tay — trên Borg AUC nhãn 0,493 / khe 0,494 / hai vế 0,495,
#     cờ gắn 97 % ô GOLD Borg (h03_auc.py). Cờ ảnh/hộp "một chữ" (A0/B0) GIỮ: f_two/tall_new/f_ink phân biệt "một chữ" trên Borg.
#   - slot_gate / hand_q / n_hum_min: CHỌN theo bản đăng ký trước (prereg_handwriting.json, sha mã h04_select.py dưới đây) trên
#     TOÀN BỘ Kinh (B18): không cấu hình nào đạt hai vế ≥ 0,995 ∧ nhãn ≥ 0,990 -> quy tắc dự phòng "hai vế cao nhất" -> bc, q 0,00015
#     (= BC + mức q cũ). Đo giữ ngoài: CV 5 khối trang Kinh hai vế 99,11 % [98,57–99,61], nhãn 98,68 %; LOBO Kinh→DungLy 97,56 %
#     (n 41) — measure_out/_thu_nghiem_anh_chu/TN5/select.json.
# printed: mọi bộ KHÔNG có trong handwriting.sets = hành vi cũ từng ô (không khoá riêng). Vắng khối profiles = hành vi cũ mọi bộ.
profiles:
  handwriting:
    sets: [stt2, stt4, stt11, B18, B34]
    drop_gates: [cnt]
    slot_gate: bc            # bc | none | vis0 (policy.SLOT_GATES)
    hand_q: 0.00015          # khoá thang hand_tables_*.pt (FAR hiệu chuẩn theo biến thể)
    n_hum_min: 3
    source: "lab/thu_nghiem_anh_chu/TN5_viet_tay/h04_select.py -> measure_out/_thu_nghiem_anh_chu/TN5/select.json"
    prereg: {registered_at: "2026-09-28 15:17:45", file: lab/thu_nghiem_anh_chu/TN5_viet_tay/prereg_handwriting.json,
             code_sha256: "158708e6e4e2bb8ec8ad6317dba44152259226e8cfb3ce0519fdfd7c04cf4f8d"}

# Thiết bị nhúng mặc định (--device ghi đè). Kết quả TẤT ĐỊNH trên MPS (lượt lặp trùng byte gold_exact.csv); CPU cho điểm
# nhúng lệch ở chữ số cuối -> có thể lật vài cờ sát ngưỡng. Thiết bị thực dùng ghi vào cột `device` của gold_exact.csv.
device: mps

# Độ phủ tham chiếu (invariant MỀM — chỉ cảnh báo, không là cổng): tỉ lệ ô GOLD có ≥ 1 chữ người dị bản cùng âm (ta_refs)
# / có chữ dị bản cho M-OCR (mocr_refs). Sàn = số đo 28/09 (TK 0,8996 · KVK 0,8128 · L83 0,3580; mocr KVK 0,8128 · L83 0,2915)
# làm tròn xuống ≈ 1–2 điểm. Rơi dưới sàn = bảng căn dị bản / tài sản đã trôi so với bộ dữ liệu -> dựng lại tài sản.
ref_coverage_min:
  ta:   {TruyenKieu1872: 0.88, KimVanKieu1884: 0.80, LucVanTien1883: 0.34}
  mocr: {KimVanKieu1884: 0.80, LucVanTien1883: 0.28}

thresholds:
  # TN1 (lab/thu_nghiem_anh_chu/TN1_cong_kiem/t01_sweep.py -> t01_summary.json thresholds.{T,L}_0.995), τ = 0,995 đăng ký trước,
  # LOBO trên IHR: old_T chọn trên TK -> chấm L16; old_L chọn trên L16 -> chấm TK; L83/KVK: AND hai hướng + viss_X ≥ max(t2);
  # Chr: C2 (p_wood hai hướng). Bộ kiểm chấm CROP CŨ (cấu hình "lai", TN4 §5/§7: KHÔNG chấm crop chuẩn).
  C5_T: [0.98744, 0.09307]     # (p_wood_T, viss_T)
  C2_T: 0.98835
  C5_L: [0.95369, 0.13467]     # (p_wood_L, viss_L)
  C2_L: 0.9745
  # STT: bộ kiểm chữ viết tay LOBO-sách (<SP>/r5/hand_lobo, mô hình + nguyên mẫu + hiệu chuẩn chỉ Borg Kinh), mức q = 0,00015
  # (chính sách v3: FAR ≤ 0,5 % cổng đầy đủ, hướng Kinh→DungLy); ngưỡng t_T/t_L không làm tròn nằm trong hand_tables_*.pt.
  stt_q: 0.00015
  stt_n_hum_min: 3             # lobo_nh ≥ 3 nguyên mẫu người của nhãn (v3 U_STT_nhan_thieu_nguyen_mau_nguoi)

# Cờ trượt BC (TN3 t02_matrix / TN1 thang G): cấu hình chọn NGOÀI sách
bc_T: {ady: 0.6, vis_z: -1.0}              # bc_k06v1 (G6, chọn trên TK) — dùng cho L16
bc_L: {ady: 0.5, adx: 0.5, vis_z: -0.5}    # bc_k05dxv05 (G7, chọn trên L16) — mọi bộ khác

# vis_z = (m_win_glyph − t_mod)/(t_mod − t_cons) — <SP>/gold_img_audit/measure/out/calib.json (m02_calib.py)
vis_calib:
  SachThanhTruyen:   {t_mod: -0.1258474700152874, t_cons: -0.4208173006772995}
  Chrestomathie1872: {t_mod: -0.0633720733225345, t_cons: -0.3731391103938222}
  LucVanTien1883:    {t_mod: -0.22382727814838285, t_cons: -0.4445947762578726}
  KimVanKieu1884:    {t_mod: -0.270755343697965, t_cons: -0.4780108262784779}
  LucVanTien1916:    {t_mod: -0.10250438014045354, t_cons: -0.299876612611115}
  TruyenKieu1872:    {t_mod: -0.1362790524959563, t_cons: -0.34591016825288534}
  # 2026-09-27: 2 bản chép tay Borg (tập đánh giá) CHƯA có hiệu chuẩn riêng (m02_calib chưa chạy trên Borg) -> dùng NGUYÊN hiệu
  # chuẩn STT (chữ viết tay Công giáo, chọn NGOÀI sách, không dò trên Borg). vis_z chỉ vào cờ BC (trượt) của Borg.
  SachKinhThayCaBinh: {t_mod: -0.1258474700152874, t_cons: -0.4208173006772995}
  SachDungLyHoThan:   {t_mod: -0.1258474700152874, t_cons: -0.4208173006772995}

# M-OCR: cờ t50 = m_hom ≤ t50 của bộ — <SP>/gold_img_audit/m_ocr/out/thresholds.json (h03_calib.py, m_hom.t50)
mocr_t50:
  SachThanhTruyen: -0.22572900354862213
  Chrestomathie1872: -0.20333627797663212
  LucVanTien1883: -0.24690037965774536
  KimVanKieu1884: -0.2586190835572779
  LucVanTien1916: -0.17829009145498276
  TruyenKieu1872: -0.2109576314687729

# Cấu hình cổng ảnh vòng 2 khuyến nghị theo bộ (<SP>/gold_img_audit/gate_v2/out/gate_v2.json recommended) — chỉ dùng để
# tái lập r2_reason == 'M_ocr_t50' (thứ tự gate_assign: A0a, A1, A2a, A0c, A0b, kim, vis, A2b, mocr). Chr/L16/TK: không có mocr.
gate_v2:
