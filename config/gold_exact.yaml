  Chrestomathie1872: {kim: "0.5dx", vis: -0.5, mocr: false}
  LucVanTien1883:    {kim: "0.5dx", vis: -0.5, mocr: true}
  KimVanKieu1884:    {kim: "0.5dx", vis: -0.5, mocr: true}
  LucVanTien1916:    {kim: 0.6, vis: -1.0, mocr: false}
  TruyenKieu1872:    {kim: "0.5dx", vis: -0.5, mocr: false}

# CHỐT AN TOÀN MỚI — ĐĂNG KÝ TRƯỚC khi đo (27/09/2026, trước lượt chạy measure_out/_gold_exact_run1; bản đăng ký kèm sha256 mã
# ghi vào <out>/prereg_core_loss.json TRƯỚC khi tính). Không dò ngưỡng: 0,3 bước và 25 % là số tự nhiên đặt trước.
# Định nghĩa (signals_geom.core_loss_of): mực của CROP CŨ (khung save_crop: pad 0,12 + carve láng giềng + tighten; mực = xám < T,
# T = ngưỡng Otsu cục bộ của crop chuẩn; bỏ vùng carve) nằm trong LÕI = |y − tâm hộp cũ| ≤ 0,3·p (p = bước cột của crop chuẩn) ×
# x ∈ [xa, xb) (dải cột của crop chuẩn); core_loss = tỉ lệ mực lõi đó KHÔNG thuộc mặt nạ mực của crop chuẩn; > 0,25 -> text_only.
# Lõi không có mực -> core_loss = 0 (không cờ). Crop chuẩn không ra ảnh (status ≠ ok) -> không tính (ô đã text_only vì ¬one_char_ok).
# Đo (không dùng để chọn): trên L16/TK — bắt bao nhiêu trong 61 + 2 ô "mất > 25 % mực lõi khe người" của TN4 (cov_core.pkl
# core_drop) và mất bao nhiêu ô đúng hai vế.
core_loss:
  band_pitch: 0.3
  max_loss: 0.25
  registered: "2026-09-27"
  # Bản đăng ký gốc (lượt measure_out/_gold_exact_run1/prereg_core_loss.json, ghi TRƯỚC khi tính); lượt sau so sha mã với đây.
  prereg: {registered_at: "2026-09-27 00:39:49", code_sha256: "de81acb40e834111326251735d182ce219e4a18dbcc71425c2a860afee2b276a"}
  # QUYẾT ĐỊNH 27/09 (sau phép đo đăng ký trước, không dò lại): KẾT QUẢ ÂM -> BỎ KHỎI CỔNG, chỉ giữ cột thông tin.
  # Đo trên nhãn người IHR (run1): chốt làm mất 46 ô "lai" ngoài luật A/M-OCR (L16 20 + TK 26), CẢ 46 đều đúng hai vế
  # (0 ô sai); chỉ bắt 6/61 ô 'damaged' TN4 của L16 (TK 1/2) và 0/8 ô damaged nằm trong "lai" của L16.
  # gate: true = tái lập đúng lượt run1 (policy 2026-09-27).
  gate: false

