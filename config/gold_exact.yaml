  Chrestomathie1872: config/pipeline_Chrestomathie1872.yaml
  LucVanTien1916: config/pipeline_LucVanTien1916.yaml
  TruyenKieu1872: config/pipeline_TruyenKieu1872.yaml
  SachKinhThayCaBinh: config/pipeline_SachKinhThayCaBinh.yaml   # 27/09 (Borg; chỉ dùng khi có trong bộ gộp)
  SachDungLyHoThan: config/pipeline_SachDungLyHoThan.yaml

# Mức chắc của số đo theo bộ (KET_QUA TN4): đo trên nhãn người IHR / ước lượng (bộ ước lượng TN3) / suy đoán
evidence_level:
  L16: do_tren_nhan_nguoi
  TK: do_tren_nhan_nguoi
  KVK: uoc_luong
  L83: uoc_luong
  stt2: suy_doan
  stt4: suy_doan
  stt11: suy_doan
