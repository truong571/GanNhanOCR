# GanNhanOCR Pipeline Configuration

  # Only Sach* — Cac* "Tuyển tập Các Thánh Truyện" books are curated subsets
  # of the corresponding Sach* "Sách Các Thánh Truyện" full books (same scans,
  # same text), so processing both would double-count training data.
  # All books re-OCR'd with VietOCR (2-pass beam + greedy for text + confidence).
  # 2026-07-20: các file PDF trên đĩa đã được đổi tên SachThanhTruyen{2,4,11}.pdf
  # -> STT{2,4,11}.pdf. `name:` CỐ Ý GIỮ NGUYÊN SachThanhTruyen* vì tên sách đi vào
  # tên crop (vd yen2_page_0012_c01_000.png) và cột `book` trong dataset_out/labels.csv;
  # đổi `name` sẽ phá toàn bộ liên kết bằng chứng đã sinh.
books:
  - name: SachThanhTruyen2
    pdf: Data/STT2.pdf
    reocr: true
  - name: SachThanhTruyen4
    pdf: Data/STT4.pdf
    reocr: true
  - name: SachThanhTruyen11
    pdf: Data/STT11.pdf
    reocr: true

paths:
  data_dir: prepared
  output_dir: dataset
  dict_dir: Dict
  qn_to_nom_dict: Dict/QuocNgu_SinoNom.csv
  similar_dict: Dict/SinoNom_Similar.csv
  font_path: font_diffusion/fonts/NomNaTong-Regular.ttf
  # Production weights from HF root (dzungpham/font-diffusion-weights). The
  # /FST/checkpoint_step_1500/ subfolder is an undertrained snapshot — never use it.
  # Both keys point at the same dir; phase1 is unused while use_fst=False in
  # core/ranking/fontdiffusion_gen.py but kept for forward compatibility.
  fontdiffusion_ckpt: font_diffusion/ckpt/PROD
  fontdiffusion_phase1_ckpt: font_diffusion/ckpt/PROD
  # Universal FontDiffusion cache (~89k glyph U+*.png) — data ĐÃ SINH SẴN ở
  # local gannhanocr-fd/ (thư mục hex). step3 nạp ĐỆ QUY (rglob "U+*.png"),
  # TRA theo Unicode codepoint, KHÔNG sinh mới (skip_local_fd_gen: true).
  fd_cache_universal: gannhanocr-fd

step1:
  dpi: 300
  denoise: true
  crop_size: 64
  sauvola_k: 0.2
  sauvola_window: 25
  min_stroke: 2
  use_ocr_api: true
  # QN re-OCR line detector (replaces the old raw horizontal projection that
  # broke on skewed scans). Options:
  #   auto             - DBNet (PaddleOCR) if installed, else projection_deskew
  #   dbnet            - PaddleOCR DB detector (handles skew, warps lines flat)
  #   projection_deskew- estimate page skew, deskew, then projection (no extra dep)
  #   projection       - original raw projection profile (legacy / A-B baseline)
  # 2026-07-21: GHIM CỨNG, KHÔNG để `auto`.
  # `auto` = dbnet nếu máy có paddleocr, ngược lại projection_deskew
  # (core/ocr/line_detector.py:54). Môi trường sinh ra số liệu luận văn là
  # py3.14 KHÔNG có paddleocr -> đã chạy projection_deskew. Nếu để `auto`,
  # một máy khác có paddleocr sẽ tách dòng bằng backend KHÁC mà không báo gì,
  # cho ra số liệu lệch âm thầm.
  qn_line_detector: projection_deskew

step2:
  deletion_cost_small: 0.3
  deletion_cost_medium: 0.6
  deletion_cost_normal: 1.2
  insertion_cost: 1.0
  # Expand each char bbox by this fraction of (w, h) on each side before cropping,
  # so the saved PNG captures the full glyph (descenders, top diacritics, side
  # radicals) even at the cost of a sliver of neighbour ink.
  crop_pad_frac: 0.18

# Step 3 (legacy DINOv2 labeling path) — RETIRED: superseded by pipeline/align_engine Step 2
# (build_dataset.py --use-s3, S3 = trained Nôm encoder). DINOv2 is DISABLED here
# (proven non-discriminative on Nôm — pipeline/align_engine/README.md).
# Code kept (core/ranking/dinov2_ranker.py), NOT deleted, for the thesis comparison.
step3:
  use_dinov2: false                 # DISABLED — replaced by trained Nôm embedder (S3)
  dinov2_model: dinov2_vitb14_reg   # Base + registers — best for fine-grained chu-Nom
  dinov2_threshold: 0.75            # cosine similarity threshold for matched=True
  classical_threshold: 0.55         # classical CV fallback (Hu+IoU+projection)
  use_fontdiffusion: true
  require_fontdiffusion: true       # if true: tier 3 ONLY uses fd_cache (no font-rendered fallback)
  # When true, step 3 will NOT try to generate missing FontDiffusion images
  # locally (~7s/img on Mac CPU = bottleneck). Chars missing from fd_cache get
  # no Tier-3 candidate — they fall through to Tier 2 or unmatched.
  # Offload generation to Kaggle via kaggle_diffusion/diffusion_run.ipynb.
  skip_local_fd_gen: true

step4:
  min_samples_per_class: 1
