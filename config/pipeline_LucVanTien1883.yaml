# Config RIÊNG LucVanTien1883 (bản sao pipeline.yaml 2026-09-21, chỉ đổi books: và paths.output_dir)
# GanNhanOCR Pipeline Configuration

  # Only Sach* — Cac* "Tuyển tập Các Thánh Truyện" books are curated subsets
  # of the corresponding Sach* "Sách Các Thánh Truyện" full books (same scans,
  # same text), so processing both would double-count training data.
  # All books re-OCR'd with VietOCR (2-pass beam + greedy for text + confidence).
  # 2026-07-20: các file PDF trên đĩa đã được đổi tên SachThanhTruyen{2,4,11}.pdf
  # -> STT{2,4,11}.pdf. `name:` CỐ Ý GIỮ NGUYÊN SachThanhTruyen* vì tên sách đi vào
  # tên crop (vd yen2_page_0012_c01_000.png) và cột `book` trong dataset_out/labels.csv;
  # đổi `name` sẽ phá toàn bộ liên kết bằng chứng đã sinh.
  #
  # 2026-09-21: khoá TUỲ CHỌN theo sách (pipeline/align_engine/book_layout.py). Vắng
  # khoá = hành vi STT cũ (9 cột, 1 tầng) — 3 sách STT dưới đây KHÔNG khai báo.
  #   layout: stt | lithograph        # "lithograph" = thạch bản lục bát (LVT1883, KVK1884):
  #                                   #   mỗi cột Nôm = 1 cặp 6⧺8 chữ, mỗi dòng .txt = 14 âm;
  #                                   #   không cần khoá `pdf` (ingest từ ảnh, step1 bỏ qua);
  #                                   #   page_ok đòi đủ n_columns cột Nôm/QN và mỗi cột QN
  #                                   #   14 âm (hoặc num_syllables ghi trong transcriptions/*.json)
  #                                   #   và phương pháp cột hybrid (không projection_fallback);
  #                                   #   thống kê vào summary.json["layout_gate"][book]
  #   n_columns: 9                    # số cột kỳ vọng/trang truyền vào detect_nom_columns_v3
  #                                   #   và cổng qn_parse_ok (thạch bản: 10)
  #   qn_syllables_per_column: 14     # chỉ với lithograph; 0 = không kiểm
  # Sách mới dùng config RIÊNG (vd config/lucvantien1883.yaml), không thêm vào books: ở đây.
books:
  # 2026-09-21: config RIÊNG cho thạch bản Lục Vân Tiên 1883 (NHIỆM VỤ 3). Không đụng
  # config/pipeline.yaml của STT. Ingest từ ảnh bằng pipeline/tools/ingest_lithograph_book.py
  # (không cần khoá pdf: step0/step1 bỏ qua khi layout=lithograph).
  - name: LucVanTien1883
    layout: lithograph
    n_columns: 10
    qn_syllables_per_column: 14
    # 2026-09-22 (NV-B): tham số detector THEO SÁCH, ghi đè step2.det_xmargin/det_thr chỉ cho
    # sách này (pipeline/align_engine/book_layout.py). Đo 1.050 cột LVT: ±0,25w đưa hộp cột kề
    # vào cửa sổ (hộp kim rộng 1,0–1,6× bước cột 157 px) -> F1 cross-col 393 ô; hộp lạ
    # 607 (0,25) / 188 (0,15) / 87 (0,10) / 42 (0,05) / 24 (0,0) -> chọn 0,05 (≈ tâm ± pitch/2,
    # còn ~8 px đệm). det_thr 0,15: n_det==N 60,4 % -> 64,8 % (0,3: 9,3 %; 0,1: 55,7 %) vì
    # điểm tin cậy CenterNet (học STT) trên thạch bản thấp; lỗi còn lại là +1 hộp trùng/−1 hộp
    # thiếu của detector, không phải biên x.
    det_xmargin: 0.05
    det_thr: 0.15
    # 2026-09-22 (I5, phương án A): giải mã hộp theo BƯỚC CỘT với ràng buộc số lượng
    # (pipeline/align_engine/char_detector/pitch_decode.py). Đo 27 trang/3.412 ô tham chiếu
    # (scripts/measure/box_ref_eval.py, docs/HUONG_DAN_HUAN_LUYEN_I5_2026-09-22.md §1): IoU ≥ 0,5
    # 97,4 → 98,1 %, miss 0,5 → 0,1 %, extra/100 ô 2,0 → 0,1, "cắt vào thân chữ" (mực chạm mép
    # > 0,20) 11,0 → 9,5 %; build --limit 10: tier y hệt, midpoint+split 53 → ink_cut+detector_low 8.
    # n_det VẪN là số hộp thô ở det_thr (I5 không thành hằng đúng); cổng B4' chuyển sang luật (a')
    # theo ô box_source ink_cut/detector_low (mechanism_gates.detect_pitch_mode đọc khoá này).
    # Đổi về `legacy` = hành vi cũ (bản dataset_LucVanTien1883_v3_legacy).
    box_decoder: pitch
    # 2026-09-23 (vòng 5, docs/CHOT_KENH_OCR_VA_QUY_HOACH_GAN_2026-09-23.md §1/§6 #1): kênh OCR Hán-Nôm
    # (kim/kinhhannom) vẫn đang được gọi với `lang_type = 1` = HÁN cho sách chữ NÔM. Đo 5 trang/sách, hai tiêu
    # chí không vòng tròn, CI Wilson KHÔNG chồng nhau: "kim ∈ tập chữ của âm QN" 70,0 -> 88,4 %, "kim == chữ dị bản
    # độc lập" 55,8 -> 72,7 % (nền dị bản 82,9 %). Cái giá đã đo: tỉ lệ cột kim đếm đúng N 84 -> 74 %. Cache kim_raw/ tách theo
    # tham số (page_XXXX_lt2.json) nên bản lang_type 1 vẫn còn nguyên để so.
    kim_lang_type: 2
    # 2026-09-23 (vòng 5, §5.2 bước 5 / §6 #3): DP chữ↔âm chạy RIÊNG trong từng tầng (6↔6 rồi 8↔8) thay vì
    # cả cột 14↔14 -> ranh giới câu lục/câu bát thành ràng buộc CỨNG (khe ở câu lục không trôi sang câu bát).
    # Phơi nhiễm đã đo: ghép xuyên tầng 18/1.044 cột (LVT), 17/1.628 (KVK). Mặc định false = hành vi cũ;
    # STT/prose không nhận khoá này (book_layout kiểm layout).
    tier_dp: true
    # 2026-09-22 tối (I5, răng cưa — lab/i5_detector_v2/README.md, HUONG_DAN_HUAN_LUYEN_I5 §0): phép thu ảnh trang
    # 3.204 → 1.024 cho detector. `linear` = cv2.resize mặc định (răng cưa khi thu 3,1× làm rụng nét mảnh) = STT không
    # đổi byte. `area` = INTER_AREA, đã đo trên chính sách này (`./run_pipeline.sh --book LucVanTien1883 --suffix _area`,
    # dataset_out_LucVanTien1883_area/, box_ref measure_out/box_ref_area/): I5 thô 65,2 → 77,7 %, ok50 pitch 98,1 → 99,3 %,
    # miss 0,5 → 0,1 %, detector_low+ink_cut 236 → 97 ô, GOLD ảnh 8.650 → 8.733, text_only 130 → 43, tier văn bản/khớp
    # dị bản không đổi; NHƯNG hộp cao hơn ~2 % (h/p 1,14 → 1,16) → crop `bleed` trên ảnh export 18,0 → 21,7 % (+429)
    # và "cắt thân chữ" pitch 9,5 → 10,6 % → theo luật "không chỉ số nào giảm" CHƯA lấy làm bản chốt; giữ `linear`.
    # Đổi một chữ `area` là tái lập bản _area. Detector v2 (Kaggle) so với mốc v1+area, không so với linear.
    detector_resize: linear
    reocr: false

# 2026-09-22: khối `run:` CHỈ run_pipeline.sh --book đọc (book_profile); engine/adapter/step0/mechanism_gates KHÔNG đọc.
# Vắng khối -> mặc định theo books[].layout. Lệnh tương đương: docs/HUONG_DAN_CHAY_SACH_MOI_2026-09-21.md §2.
run:
  ingest: lithograph            # pipeline.tools.ingest_lithograph_book (--ocr kim, cache kim_raw/ -> 0 gọi API)
  # --contrast stretch là MẶC ĐỊNH và trên bản quét này là ÁNH XẠ ĐỒNG NHẤT: ảnh gốc LVT đã có p2 = 0 và
  # p90 = 255 nên stretch_gray không đổi một điểm ảnh nào (đo 2026-09-23, crop `none` và `stretch` TRÙNG md5 —
  # docs/CHOT_KENH_OCR_VA_QUY_HOACH_GAN_2026-09-23.md §3). Giữ khoá mặc định để pages/*.png không đổi md5;
  # KHÔNG dùng `otsu` (đo: kém hơn stretch — eq_label 88,1 vs 93,2). --qn-count-rule: luật 6/8 (§6 #2).
  ingest_args: "--qn-count-rule"   # LVT: --verse-map formula (mặc định), --contrast stretch (mặc định, ánh xạ đồng nhất); KHÔNG --dict-boost
  n_columns: 10                 # export_final_dataset / make_dataset_docs --n-columns (STT 9, thạch bản 10, văn xuôi 7)
  cross: true                   # auto_precision --steps cross (LVT1916 NF) -> mechanism_gates --cross (cổng d) + B6

paths:
  data_dir: prepared
  output_dir: dataset/LucVanTien1883   # lưu vào trong folder dataset/LucVanTien1883/ theo quy chuẩn
  dict_dir: Dict
  qn_to_nom_dict: Dict/QuocNgu_SinoNom.csv
  similar_dict: Dict/SinoNom_Similar.csv
  font_path: font_diffusion/fonts/NomNaTong-Regular.ttf
  # Production weights from HF root (dzungpham/font-diffusion-weights). The
  # /FST/checkpoint_step_1500/ subfolder is an undertrained snapshot — never use it.
  # Both keys point at the same dir; phase1 is unused while use_fst=False in
  # core/ranking/fontdiffusion_gen.py but kept for forward compatibility.
  fontdiffusion_ckpt: font_diffusion/ckpt/PROD
  fontdiffusion_phase1_ckpt: font_diffusion/ckpt/PROD
  # Universal FontDiffusion cache (~89k glyph U+*.png) — data ĐÃ SINH SẴN ở
  # local gannhanocr-fd/ (thư mục hex). step3 nạp ĐỆ QUY (rglob "U+*.png"),
  # TRA theo Unicode codepoint, KHÔNG sinh mới (skip_local_fd_gen: true).
  fd_cache_universal: gannhanocr-fd

step1:
  dpi: 300
  denoise: true
  crop_size: 64
  sauvola_k: 0.2
  sauvola_window: 25
  min_stroke: 2
  use_ocr_api: true
  # QN re-OCR line detector (replaces the old raw horizontal projection that
  # broke on skewed scans). Options:
  #   auto             - DBNet (PaddleOCR) if installed, else projection_deskew
  #   dbnet            - PaddleOCR DB detector (handles skew, warps lines flat)
  #   projection_deskew- estimate page skew, deskew, then projection (no extra dep)
  #   projection       - original raw projection profile (legacy / A-B baseline)
  # 2026-07-21: GHIM CỨNG, KHÔNG để `auto`.
  # `auto` = dbnet nếu máy có paddleocr, ngược lại projection_deskew
  # (core/ocr/line_detector.py:54). Môi trường sinh ra số liệu luận văn là
  # py3.14 KHÔNG có paddleocr -> đã chạy projection_deskew. Nếu để `auto`,
  # một máy khác có paddleocr sẽ tách dòng bằng backend KHÁC mà không báo gì,
  # cho ra số liệu lệch âm thầm.
  qn_line_detector: projection_deskew

step2:
  deletion_cost_small: 0.3
  deletion_cost_medium: 0.6
  deletion_cost_normal: 1.2
  insertion_cost: 1.0
  # --- HÌNH HỌC CẮT ẢNH ------------------------------------------------------
  # CẢ HAI NÚM DƯỚI ĐÂY ĐỀU ĐƯỢC build_dataset.py ĐỌC THẬT (nối 2026-08-25).
  # Trước đó `crop_pad_frac: 0.18` là DÒNG CHẾT: không mã nào đọc, `--pad` mặc định
  # 0.12, và run_pipeline không truyền — nên 66k crop đã giao thực ra cắt ở 0,12
  # trong khi cấu hình khai 0,18. Nay giá trị ở đây LÀ giá trị chạy.

  # Nới mỗi cạnh hộp thêm phần này của (w, h) TRƯỚC khi cắt, để crop bắt trọn nét
  # (đuôi chữ, dấu trên, bộ bên). Đo T4-B': ở 0 thì 51,7% crop bị cắt mất nét; ở
  # 0,12 chỉ còn 0,4%; lên 0,45 chỉ bớt thêm 0,2 điểm mà đẩy dính-láng-giềng từ
  # 51% lên 69% số crop. Nên 0,12 là điểm làm việc, đã đo chứ không phải mặc định.
  crop_pad_frac: 0.12

  # Biên nới DỌC của hộp ký tự, theo BƯỚC LẶP của cột: hộp cao = pitch × (1 + 2F).
  # Xem align_production.BOX_OVERLAP_FRAC. Đổi giá trị này = CẮT LẠI TOÀN BỘ CROP.
  #
  # 🔴 ĐÃ THỬ 0 VÀ HOÀN NGUYÊN (2026-08-25). Lý do đầy đủ ở BOX_OVERLAP_FRAC.
  box_overlap_frac: 0.10

  # A-6 (flow N3f, 2026-09-16): hộp thô detector cho luật --box-rule syl_index.
  # Ngưỡng tin cậy CenterNet và biên x lọc hộp theo cột (± phần của bề rộng cột).
  # Đo trên cột OCR=QN: 0,2 / ±0,25w cho M==N 93,2% (cũ 0,3 / ±0,5w: 69,9%).
  # `--box-rule legacy` KHÔNG đọc hai khoá này (trọn gói 0,3 / ±0,5w để tái lập bộ cũ).
  det_thr: 0.2
  det_xmargin: 0.25

# Step 3 (legacy DINOv2 labeling path) — RETIRED: superseded by pipeline/align_engine Step 2
# (build_dataset.py --use-s3, S3 = trained Nôm encoder). DINOv2 is DISABLED here
# (proven non-discriminative on Nôm — pipeline/align_engine/README.md).
# Code kept (core/ranking/dinov2_ranker.py), NOT deleted, for the thesis comparison.
step3:
  use_dinov2: false                 # DISABLED — replaced by trained Nôm embedder (S3)
  dinov2_model: dinov2_vitb14_reg   # Base + registers — best for fine-grained chu-Nom
  dinov2_threshold: 0.75            # cosine similarity threshold for matched=True
  classical_threshold: 0.55         # classical CV fallback (Hu+IoU+projection)
  use_fontdiffusion: true
  require_fontdiffusion: true       # if true: tier 3 ONLY uses fd_cache (no font-rendered fallback)
  # When true, step 3 will NOT try to generate missing FontDiffusion images
  # locally (~7s/img on Mac CPU = bottleneck). Chars missing from fd_cache get
  # no Tier-3 candidate — they fall through to Tier 2 or unmatched.
  # Offload generation to Kaggle via kaggle_diffusion/diffusion_run.ipynb.
  skip_local_fd_gen: true

step4:
  min_samples_per_class: 1
