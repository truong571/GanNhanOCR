# Config RIÊNG SachKinhThayCaBinh (Vatican Borgiano Tonchinese 18 — Sách kinh Thầy cả Bỉnh)
# GanNhanOCR Pipeline Configuration
#
# Sách VĂN XUÔI chép tay chữ Nôm Công giáo Philiphê Bỉnh (529 trang chữ, ~10-11 cột/trang, ~20-22 chữ/cột).
# Đọc cột PHẢI→TRÁI (RTL truyền thống).
# Ingest và chuẩn hóa từ data/SachKinhThayCaBinh (ảnh số hóa Thư viện Vatican DigiVatLib + Excel phiên âm).
# Bố cục: layout: prose, n_columns: auto (số cột theo trang), det_xmargin: 0.05, det_thr: 0.15.
#
# 2026-09-27 (docs/BORG_DANH_GIA_2026-09-27.md): TẬP ĐÁNH GIÁ CHỮ VIẾT TAY (như 2 bộ IHR). Ingest bằng adapter RIÊNG
# pipeline.tools.ingest_borg_book (KHÔNG ingest_prose_book — adapter đó viết cho Chrestomathie): ảnh gốc 720 px,
# kim TOÀN TRANG lang_type 2 (×1, cache prepared/_auto/SachKinhThayCaBinh/kim_raw/*_lt2.json), QN = âm tiết NGƯỜI của trang (Excel
# ChuQN_txt), ghép chữ kim ↔ âm bằng DP đơn điệu. Adapter KHÔNG đọc cột SinoNom_Char (nhãn người chỉ để ĐO:
# scripts/measure/borg_endtoend_eval.py). Đầu ra prepared/_auto/SachKinhThayCaBinh/ — prepared/SachKinhThayCaBinh/ (ingest_borg_tonch, nhãn người)
# không bị ghi. Bộ xuất đóng dấu evaluation_only (mark_eval_dataset --kind borg) -> bộ gộp evaluation_only=1 (không chia tập).
# config/pipeline_MSS_Borg_tonch_18.yaml = BÍ DANH trùng (run.alias_of) — run_pipeline từ chối chạy nó.
books:
  - name: SachKinhThayCaBinh
    qn_charfix: true
    layout: prose
    n_columns: auto
    det_xmargin: 0.05
    det_thr: 0.15
    box_decoder: visual_dp        # 2026-09-28 TN6 (docs/HOP_ANH_TN6_2026-09-28.md): đúng vị trí vs hộp người 61,5 → 99,4 % (Kinh), 58,6 → 99,8 % (DungLy); trước: pitch
    kim_lang_type: 2
    detector_resize: linear
    crop_source: original
    mechanism_gates: true
    qn_count_gate: review
    reocr: false

run:
  ingest: borg                  # pipeline.tools.ingest_borg_book (kim lt2 toàn trang + QN người theo trang)
  dataset_out: prepared/_auto/SachKinhThayCaBinh/dataset_out   # mọi thứ của đường tự động dưới prepared/_auto/SachKinhThayCaBinh/
  n_columns: 10                 # số cột phổ biến (chỉ sửa LOG/README "trang không đủ N cột"; thực tế ~10–11)
  cross: false                  # không có dị bản số hoá; độ đúng đo bằng NHÃN NGƯỜI (borg_endtoend_eval)

paths:
  data_dir: prepared/_auto      # adapter ghi prepared/_auto/<Sách>/ (KHÔNG đè prepared/<Sách>/ chứa nhãn người)
  output_dir: dataset/SachKinhThayCaBinh
  dict_dir: Dict
  qn_to_nom_dict: Dict/QuocNgu_SinoNom.csv
  similar_dict: Dict/SinoNom_Similar.csv
  font_path: font_diffusion/fonts/NomNaTong-Regular.ttf
  fontdiffusion_ckpt: font_diffusion/ckpt/PROD
  fontdiffusion_phase1_ckpt: font_diffusion/ckpt/PROD
  fd_cache_universal: gannhanocr-fd

step1:
  dpi: 300
  denoise: true
  crop_size: 64
  sauvola_k: 0.2
  sauvola_window: 25
  min_stroke: 2
  use_ocr_api: true
  qn_line_detector: projection_deskew

step2:
  deletion_cost_small: 0.3
  deletion_cost_medium: 0.6
  deletion_cost_normal: 1.2
  insertion_cost: 1.0
  crop_pad_frac: 0.12
  box_overlap_frac: 0.10
  det_thr: 0.15
  det_xmargin: 0.05

step3:
  use_dinov2: false
  dinov2_model: dinov2_vitb14_reg
  dinov2_threshold: 0.75
  classical_threshold: 0.55
  use_fontdiffusion: true
  require_fontdiffusion: true
